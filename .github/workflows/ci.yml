name: CI

# 每次推送到 main / 发 PR 都跑。目标是**快且离线**：
# 回归套件本身完全离线（不连真打印机、不连公网），所以这里不需要任何凭据。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次，省 runner 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 回归测试 (Python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 桌面版用 3.13；3.10 是安卓版内嵌的版本，
          # 有些坑只有它才暴露（见 docs/PACKAGING.md 的 threading.Thread 那节）
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 只装协议层依赖。**刻意不装 PySide6**：套件在没有 Qt 时会自动跳过
      # 界面相关断言（实测 688 passed），而 PySide6 有上百 MB，
      # 装上只为了让几条断言不跳过并不划算。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install pytest

      # Qt 平台插件在无显示环境下的兜底（即使没装 PySide6 也无害）
      - name: 回归测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      # 慢速端到端：内置模拟器 + 真实端口，覆盖"画面上得来、遥测连得上"
      - name: 端到端（模拟器）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m slow

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ruff
      - name: ruff
        run: ruff check .
