name: Release

# 打一个形如 v1.0.0 的 tag 就会：
#   1. 在 Windows / Linux 两个 runner 上构建全部产物
#   2. 打包前先在干净容器里做**冒烟验证**（起服务 + 健康检查）
#   3. 建 Release 并把单文件产物挂上去
#
# 为什么要跨平台两个 runner：PyInstaller **不能跨平台编译**，
# Windows 的 exe 必须在 Windows 上打，Linux 的 ELF 必须在 Linux 上打。
# 安卓 APK 也放在 Windows runner：`android/build-apk.ps1` 是 PowerShell 脚本，
# 且 Chaquopy 在 Windows 上构建是验证过的路径（详见 docs/PACKAGING.md）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.0）"
        required: true

permissions:
  contents: write

# 同一个 tag 重复触发时取消上一次：否则两个 run 并行上传同名 artifact 会互相干扰，
# 而 Release 也会被建两次。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows 单文件 + 安卓 APK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 桌面版固定 3.13：与本地开发一致，也是 requirements.txt 的目标
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: 构建 Windows 单文件
        run: python -m PyInstaller --noconfirm --clean BambuMonitor-onefile.spec

      # ⚠️ 冒烟验证要跑 **CLI 版**（BambuMonitor-cli.exe），不是 GUI 版。
      #
      # GUI 版用 windowed 引导器（runw.exe），**根本没有控制台句柄**，
      # `--version` / `--core-test` 的输出既看不到、也重定向不到
      # （这正是这个工作流第一次跑就失败的原因：拿到了空字符串）。
      # CLI 版用 console 引导器（run.exe），输出可被捕获，才能真正断言。
      - name: 冒烟验证 exe
        shell: pwsh
        run: |
          $gui = "dist\BambuMonitor.exe"
          $cli = "dist\BambuMonitor-cli.exe"
          foreach ($p in @($gui, $cli)) {
            if (-not (Test-Path $p)) {
              Get-ChildItem dist -Recurse | Select-Object FullName
              throw "找不到产物 $p"
            }
            Write-Host "$p : $([math]::Round((Get-Item $p).Length/1MB,1)) MB"
          }

          $versionOut = (& $cli --version) 2>&1 | Out-String
          Write-Host $versionOut
          if ($versionOut -notmatch "Bambu Monitor \d") {
            throw "--version 没有打印出版本号，实际输出：'$versionOut'"
          }

          $coreOut = (& $cli --core-test) 2>&1 | Out-String
          Write-Host $coreOut
          if ($coreOut -notmatch "全部通过") {
            throw ("--core-test 未报告自检通过，输出尾部：" +
                   $coreOut.Substring([Math]::Max(0, $coreOut.Length - 1500)))
          }
          Write-Host "冒烟验证通过（CLI 版的版本号与模拟器自检都已确认）"

      # ⚠️ 上传步骤**不能重复**：upload-artifact@v4 在同一个 workflow run 里
      # 不允许同名 artifact 创建两次，第二次会报
      # "(409) Conflict: an artifact with this name already exists on the workflow run"。
      # 这里曾经因为这个文件里留了一个重复的"上传 Windows 产物"步骤而失败。
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/BambuMonitor.exe
            dist/BambuMonitor-cli.exe
          if-no-files-found: error

      # ---- 安卓 APK ----
      # Chaquopy 要求 buildPython 的主次版本与 chaquopy.version 一致，
      # 而安卓版锁定 3.10（Chaquopy 仓库在 android_24_arm64_v8a 上只有 cp310 的
      # opencv）—— 详见 android/app/build.gradle 里的长注释。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⚠️ 这里**不再**用 android-actions/setup-android。
      #
      # 它内部会执行 `sdkmanager "tools"` —— 而 Google 已经把这个旧包从 SDK 仓库
      # 下掉了，于是整步变成：
      #     Warning: Failed to find package 'tools'
      #     Error: The process '...\cmdline-tools\16.0\bin\sdkmanager.bat' failed with exit code 1
      # v1.0.5 的发布为此时连续失败三次（v1.0.4 时那个包还在，所以当时能过）。
      # 这不是我们的代码问题，但**发布被它整个卡住**，所以改成自己就位：
      # windows-latest 镜像本来就预装了 Android SDK（`C:\Android\android-sdk`，含
      # platforms/build-tools），这里只做「定位 + 校验 + 导出环境变量」，
      # 缺包时才用镜像自带的 sdkmanager 补。
      - name: 就位 Android SDK（用镜像预装的那份）
        shell: pwsh
        env:
          # 只作为候选路径，避免依赖任何第三方 action 的副作用
          SDK_CANDIDATES: "C:\\Android\\android-sdk"
        run: |
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, $env:SDK_CANDIDATES,
                          (Join-Path $env:LOCALAPPDATA "Android\Sdk")) |
                        Where-Object { $_ -and (Test-Path $_) }
          $sdk = $candidates | Where-Object { Test-Path (Join-Path $_ "platforms") } |
                 Select-Object -First 1
          if (-not $sdk) { $sdk = $candidates | Select-Object -First 1 }
          if (-not $sdk) { throw "运行器上没有 Android SDK（windows-latest 镜像本应预装）" }
          Write-Host "Android SDK：$sdk"
          "ANDROID_HOME=$sdk"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $need = @()
          if (-not (Test-Path (Join-Path $sdk "platforms\android-34")))     { $need += "platforms;android-34" }
          if (-not (Test-Path (Join-Path $sdk "build-tools\34.0.0")))       { $need += "build-tools;34.0.0" }
          if (-not (Test-Path (Join-Path $sdk "platform-tools")))           { $need += "platform-tools" }
          if ($need.Count -gt 0) {
            $manager = Get-ChildItem (Join-Path $sdk "cmdline-tools") -Recurse -Filter sdkmanager.bat -ErrorAction SilentlyContinue |
                       Select-Object -First 1
            if (-not $manager) { throw "SDK 缺这些包：$($need -join ' / ')，且找不到 sdkmanager" }
            Write-Host "补齐：$($need -join ' / ')"
            # 先接受许可（已接受时是空操作），否则安装会因为交互提示卡住
            $yes = ("y`n" * 80)
            $yes | & $manager.FullName --licenses 2>&1 | Out-Null
            & $manager.FullName @need 2>&1 | Select-Object -Last 5 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "sdkmanager 安装失败：$($need -join ' / ')" }
          }
          Write-Host "build-tools："; Get-ChildItem (Join-Path $sdk "build-tools") -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "platforms：";   Get-ChildItem (Join-Path $sdk "platforms")   -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      - uses: actions/setup-python@v5
        id: py310
        with:
          python-version: "3.10"

      # 还原固定签名材料。
      #
      # ⚠️ 为什么必须用**固定的** keystore：一直用 debug 签名会让用户无法覆盖安装
      # —— debug keystore 每台机器/每次 CI 都不同，同一个包名换签名安装时系统
      # 直接拒绝（"应用未安装"），用户只能卸载重装、配置全丢。
      #
      # 密钥存在仓库 Secrets 里、绝不入库（.gitignore 已挡住 .android-signing/
      # 与 keystore.properties）。缺失时 Gradle 会退回 debug 签名，
      # 下面的「校验 APK 签名」会因此失败 —— 宁可整个发布失败，
      # 也不要发一个用户装不上的包出去。
      - name: 还原签名材料
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if (-not $env:KEYSTORE_B64) { throw "缺少 ANDROID_KEYSTORE_BASE64 secret" }
          New-Item -ItemType Directory -Force -Path .android-signing | Out-Null
          [IO.File]::WriteAllBytes(
            ".android-signing\bambu-monitor-release.jks",
            [Convert]::FromBase64String($env:KEYSTORE_B64))
          # ⚠️ 必须用**无 BOM** 的 ASCII：Java 的 Properties.load() 会把 BOM
          # 当成第一个键名的一部分，导致 storeFile 读不到（其余键正常），
          # 于是静默退回 debug 签名 —— 这个坑真实踩过。
          [IO.File]::WriteAllLines(".android-signing\keystore.properties", @(
            "storeFile=bambu-monitor-release.jks",
            "storePassword=$env:STORE_PASSWORD",
            "keyAlias=$env:KEY_ALIAS",
            "keyPassword=$env:KEY_PASSWORD"
          ), (New-Object Text.ASCIIEncoding))
          Write-Host "  签名材料已就位（keystore $((Get-Item '.android-signing\bambu-monitor-release.jks').Length) B）"

      - name: 构建 APK
        shell: pwsh
        env:
          # setup-python 把 3.10 装在 hostedtoolcache 下，脚本按注册表/固定路径
          # 找不到它，所以显式告诉它。脚本里还有"当前解释器"与 py 启动器兜底。
          #（Android SDK 由 setup-android 设好 ANDROID_HOME，脚本会自己认）
          BAMBU_BUILD_PYTHON: ${{ steps.py310.outputs.python-path }}
        run: |
          # build-apk.ps1 会同步 Python 源码、就位签名材料、跑 Gradle
          powershell -ExecutionPolicy Bypass -File android\build-apk.ps1

      - name: 校验 APK 签名与内容
        shell: pwsh
        run: |
          $apk = Get-ChildItem dist-android\*.apk | Select-Object -First 1
          if (-not $apk) { throw "没有产出 APK" }
          Write-Host "APK: $($apk.Name)  $([math]::Round($apk.Length/1MB,1)) MB"

          $signer = "$env:ANDROID_HOME\build-tools\34.0.0\apksigner.bat"
          if (-not (Test-Path $signer)) {
            $signer = (Get-ChildItem "$env:ANDROID_HOME\build-tools" -Recurse -Filter apksigner.bat |
                       Select-Object -First 1).FullName
          }
          $certs = & $signer verify --print-certs $apk.FullName 2>&1 | Out-String
          Write-Host $certs
          if ($certs -match "CN=Android Debug") {
            throw "APK 用的是 debug 签名 —— 用户将无法覆盖安装，拒绝发布"
          }
          if ($certs -notmatch "CN=Bambu Monitor") {
            throw "APK 签名不是预期的发布证书（CN=Bambu Monitor），拒绝发布"
          }
          Write-Host "签名校验通过（固定发布证书）"

          # 入口模块必须真的在包里 —— 它曾经因与 Chaquopy 保留名撞车而被静默丢弃
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($apk.FullName)
          $imy = $zip.Entries | Where-Object { $_.FullName -eq 'assets/chaquopy/app.imy' }
          if (-not $imy) { $zip.Dispose(); throw "APK 里没有 app.imy" }
          $ms = New-Object IO.MemoryStream
          $s = $imy.Open(); $s.CopyTo($ms); $s.Close(); $zip.Dispose()
          $ms.Position = 0
          $inner = New-Object IO.Compression.ZipArchive($ms, [IO.Compression.ZipArchiveMode]::Read)
          $names = $inner.Entries | ForEach-Object { $_.FullName }
          $inner.Dispose()
          if (-not ($names -contains 'device_server.pyc')) {
            throw "app.imy 里没有 device_server.pyc —— 应用启动会报 ModuleNotFoundError"
          }
          Write-Host "入口模块已打包：device_server.pyc"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist-android/*.apk
          if-no-files-found: error
  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux 单文件 + Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 复用仓库自己的构建脚本而不是在 runner 上直接装 Qt：
      # 那两个脚本把"构建环境 = 部署环境"这件事已经验证过了
      # （带界面版缺 libxcb/libGL 会炸，脚本里为此专门分了构建镜像）。
      - name: 构建 Linux 无界面版
        run: bash linux/build-headless-docker.sh

      - name: 构建 Linux 带界面版
        run: bash linux/build-onefile-docker.sh

      - name: 上传 Linux 产物
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-onefile-headless/BambuMonitor-headless
            dist-onefile-linux/BambuMonitor-linux
          if-no-files-found: error

      - name: 构建 Docker 镜像并导出
        run: |
          docker build -t bambu-monitor:latest .
          docker run -d --name smoke -p 18080:8080 bambu-monitor:latest || true
          for i in $(seq 1 20); do
            sleep 3
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "健康检查通过"; break
            fi
          done
          curl -fsS http://127.0.0.1:18080/health && echo
          docker rm -f smoke || true
          mkdir -p dist-docker
          docker save bambu-monitor:latest | gzip -9 > dist-docker/bambu-monitor-image.tar.gz

      - name: 上传 Docker 产物
        uses: actions/upload-artifact@v4
        with:
          name: docker
          path: dist-docker/bambu-monitor-image.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  release:
    name: 发布
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 收集全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理文件名并生成校验清单
        run: |
          set -euo pipefail

          # ⚠️ 不假设 download-artifact 落盘的层级，按**文件名递归查找**。
          #
          # upload-artifact@v4 在 path 是目录或多文件时，会把共同父目录也保留在
          # 归档里，于是解出来的路径是 artifacts/<artifact 名>/<原目录>/<文件>。
          # 之前写死 `artifacts/linux/BambuMonitor-headless` 就在这一步挂了
          # （cp: cannot stat）。按 basename 找一次，以后改上传方式也不会再断。
          pick() {
            local base="$1"
            local found
            found="$(find artifacts -type f -name "$base" | head -n 1)"
            if [ -z "$found" ]; then
              echo "::error::在下载的产物里找不到 $base，实际内容如下："
              find artifacts -type f | head -n 40
              exit 1
            fi
            echo "$found"
          }

          echo "=== 下载到的产物 ==="
          find artifacts -type f -printf '%10s  %p\n' | sort -k2

          mkdir -p release
          cp "$(pick BambuMonitor.exe)"       release/BambuMonitor-windows-x64.exe
          cp "$(pick BambuMonitor-cli.exe)"   release/BambuMonitor-windows-x64-cli.exe
          cp "$(pick BambuMonitor-headless)"  release/BambuMonitor-linux-headless-x64
          cp "$(pick BambuMonitor-linux)"     release/BambuMonitor-linux-gui-x64

          # 名字里带 tag/版本的两个产物按后缀找：
          #   Docker: bambu-monitor-image.tar.gz
          #           （注意工作流里是 `docker save > dist-docker/bambu-monitor-image.tar.gz`，
          #            而本地 build-docker-image.ps1 产出的是
          #            bambu-monitor-latest-image.tar.gz —— 两个名字不一样，
          #            曾经照着本地的名字写死模式，结果 CI 上找不到。
          #            这里用宽松模式，两边都匹配得上）
          #   APK   : BambuMonitor-1.0.0-arm64.apk
          copy_by_suffix() {
            local pattern="$1" dest="$2"
            local found
            found="$(find artifacts -type f -name "$pattern" | head -n 1)"
            if [ -z "$found" ]; then
              echo "::error::找不到匹配 $pattern 的产物，实际内容如下："
              find artifacts -type f | head -n 40
              exit 1
            fi
            cp "$found" "$dest"
          }
          copy_by_suffix 'bambu-monitor*.tar.gz' release/BambuMonitor-docker-image.tar.gz
          copy_by_suffix '*.apk'                 release/BambuMonitor-android-arm64.apk

          chmod +x release/BambuMonitor-linux-headless-x64 release/BambuMonitor-linux-gui-x64

          echo "=== 发布文件 ==="
          ls -lh release

          # 逐项确认体积合理（防止把空文件或半截文件发出去）
          for f in release/*; do
            size=$(stat -c %s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f 只有 $size 字节，明显不对"
              exit 1
            fi
          done

          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          # CLI 版必须真的在包里（它曾经"文档里说有、实际从没产出过"）
          test -f BambuMonitor-windows-x64-cli.exe || { echo "::error::缺少 Windows CLI 产物"; exit 1; }

      - name: 生成发布说明（取 CHANGELOG 里对应版本的那一段）
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p release
          # 用仓库自己的 Python 工具抽取（同一份逻辑在 tests/test_release_notes.py 里有验证）；
          # 段落缺失时它会打印 ::warning:: 并写一份兜底说明，**不会**让发布失败
          python tools/extract_release_notes.py "$TAG" release/RELEASE_NOTES.md

      - name: 建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          # ⚠️ 同时给 body_path 与 generate_release_notes：
          # body_path 里的 CHANGELOG 段落是**人写的**（为什么改、怎么验证），
          # 自动生成的变更列表作为补充。v1.0.5 第一次发布时只用了
          # generate_release_notes，而直接推 commit（无 PR）时它几乎产不出内容，
          # 发布页上只有一行 compare 链接。
          body_path: release/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
