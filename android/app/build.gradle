// 拓竹打印机监控台 · 安卓版
//
// 关键点说明见 android/README.md 与 settings.gradle 的注释。
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {

    // ------------------------------------------------------------------ 签名
    //
    // ⚠️ 为什么要有这一段：**一直用 debug 签名会让用户无法覆盖安装**。
    // debug keystore 是每台机器/每次 CI 各自生成的，同一个包名换签名安装时
    // 系统会直接拒绝（"应用未安装"），用户只能卸载重装 —— 配置全丢。
    //
    // 所以这里读一个**固定的发布 keystore**，并让 debug 构建也用它签名：
    //   * 本地：android/keystore.properties（由 build-apk.ps1 从未入库的
    //     .android-signing/ 目录复制过来）
    //   * CI：工作流从 GitHub Secrets 还原 keystore 与口令后写出同一个文件
    //   * 两处都没有时**退回 debug 签名**并打印提示 —— 保证新克隆的仓库
    //     仍能直接构建，不至于因为缺密钥而卡住
    def signingProps = new Properties()
    def signingFile = rootProject.file("keystore.properties")
    if (signingFile.exists()) {
        signingFile.withInputStream { signingProps.load(it) }
    }
    def hasReleaseSigning = signingProps.getProperty("storeFile") != null

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(signingProps.getProperty("storeFile"))
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }
    namespace 'com.bambumonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.bambumonitor"
        minSdk 24              // Chaquopy 17 要求至少 24
        targetSdk 34
        versionCode 6
        versionName "1.0.5"

        ndk {
            // Python 解释器是原生组件，必须指定 ABI。
            // arm64-v8a 覆盖当前绝大多数平板/手机（32 位 armeabi-v7a 机型已基本淘汰）。
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // debug 也用固定签名：否则用户在真机上装过一版之后就再也覆盖不上了
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // 不要开 useLegacyPackaging = true：会让原生库不压缩地进 APK、
        jniLibs { useLegacyPackaging = false }
    }
}

chaquopy {
    defaultConfig {
        // ⚠️ 这个版本号不是随手填的，被 Chaquopy 仓库里的预编译 wheel 死死限制住。
        //
        // Chaquopy 会把 pip 指向它自己的仓库 https://chaquo.com/pypi-13.1，
        // 并且只接受 **平台标签精确等于** android_<minSdk>_<abi> 的 wheel
        // （见 build-packages.zip 里的 PipInstall.platform_tag）。
        // 本项目 minSdk=24、abi=arm64-v8a，因此平台标签固定为 android_24_arm64_v8a。
        //
        //     android_24_arm64_v8a 上实际存在的 wheel
        //     ─────────────────────────────────────────────
        //     opencv-python-headless : 只有 cp310 (4.5.1.48)
        //     numpy                  : 只有 cp313 (1.26.2)
        //     cryptography           : cp310 / cp311 / cp312 / cp313
        //
        // 也就是说：opencv 与 numpy **没有任何一个 Python 版本能同时满足**
        // （opencv 要 3.10，numpy 要 3.13）。RTSPS 画面需要 opencv，
        // 而 cv2 又硬依赖 numpy（"OpenCV bindings requires numpy package"），
        // 所以这里选 3.10 走 opencv 那条路，numpy 用下面的 offline-wheels 补上
        // （那个 wheel 是给 android_21 编的，但 ndk 向后兼容，装上去可用）。
        //
        // 选 3.10 的另一个好处：它正是 Chaquopy 17 的默认版本，覆盖最全。
        // 桌面版仍用 3.13，二者互不影响（app/ 下的代码同时兼容 3.10 与 3.13）。
        version = "3.10"

        // ⚠️ buildPython 必须指向**本机**的 Python 解释器：Chaquopy 用它来
        // 解析/编译 pip 依赖。不指定的话它会在 PATH 里找 python3，
        // 而本机 PATH 上的 python 是应用商店占位符（0 字节转发器），必然失败。
        // 另外 Chaquopy 17 起要求 buildPython 的主次版本与 version 完全一致，
        // 所以这里必须是 3.10.x，不能用项目主 .venv 的 3.13。
        // 由 android/build-apk.ps1 写入 local.properties；读不到就依次退回
        // .venv310 / D:\python310。
        def localProps = new Properties()
        def localFile = rootProject.file("local.properties")
        if (localFile.exists()) {
            localFile.withInputStream { localProps.load(it) }
        }
        def venvPython = localProps.getProperty("bambu.python")
        if (venvPython == null) {
            venvPython = new File(rootProject.projectDir, "../.venv310/Scripts/python.exe")
                    .getCanonicalPath()
        }
        buildPython venvPython

        pip {
            // ⚠️ 只装**纯 Python** 包。
            //
            // 这里刻意不装 opencv-python-headless / numpy / cryptography：
            // Chaquopy 仓库里给这三个的预编译 wheel 是 **4096 字节对齐**的，
            // 而 16KB 内存页的设备（新 ARM Chromebook、Pixel 8+ 等）**拒绝加载**
            // 这类库。Python 启动时导入它们会抛 Java 异常 —— 用户看到的是**闪退**。
            //
            //   Chaquopy 17.0.0 发布说明原文：
            //   "any Android wheels built before October 2024 will still fail to
            //    load on 16 KB devices."
            //
            // 本工程里的这三项都是**可选**的，都有兜底：
            //   * opencv 缺失 -> RTSPS 通道不可用，自动退回 6000 端口 JPEG
            //     （app/bambu/rtsp.py 里 available() 判空并给出说明）
            //   * numpy       -> 只被 cv2 需要
            //   * cryptography-> 只给内置模拟器生成自签证书（安卓版不用模拟器）
            //
            // 代价：X1 / X2D / H2 这类**只提供 RTSPS** 的机型在安卓上看不到画面
            // （A1 / P1 / A2L 走 6000 端口，不受影响）。换取"在所有设备上都能启动"，
            // 这个取舍是划算的 —— 闪退等于完全不能用。
            //
            // 若将来 Chaquopy 提供了 16KB 对齐的 wheel，把下面几行加回来即可。
            install "paho-mqtt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    // 前台服务用 ServiceCompat / NotificationCompat（后台保活的关键，见 MonitorService）
    implementation 'androidx.core:core:1.13.1'
}

// androidx.webkit 会传递依赖 kotlin-stdlib-jdk7/jdk8 1.6.21，而 AGP 自带
// kotlin-stdlib 1.8.22。Kotlin 1.8 起把 jdk7/jdk8 的内容并进了 kotlin-stdlib
// 本身，于是 checkDebugDuplicateClasses 会因为两边都含同一批类而失败
// （kotlin.collections.jdk8.CollectionsJDK8Kt 等）。把三个坐标统一到同一版本
// 即可——版本一致时后两个是空壳，不再与 kotlin-stdlib 冲突。
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin'
                && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}
