// 根工程构建文件（**不是**应用模块）。
//
// ⚠️ 这里只能 `apply false` 地声明插件版本，不能直接 `id 'com.android.application'`：
// 直接 apply 会让 Gradle 把根工程本身当成一个 Android 应用模块，
// 于是它去找 `android { ... }` 配置时用的是根目录，报出
// "Plugin [id: 'com.android.application'] was not found"。
// 真正的应用模块是 `:app`（见 app/build.gradle）。
//
// 历史教训：本文件曾经是旧版 WebView 壳的**模块级** build.gradle，
// 加入 Chaquopy 版 app 模块后两者冲突，构建一直失败。
// 想改应用配置请改 app/build.gradle。
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'com.chaquo.python' version '17.0.0' apply false
}
