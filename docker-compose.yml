# 拓竹打印机监控台 · Docker Compose
#
# 关键点：局域网自动搜索（SSDP 组播 / 2021 广播）与手机直连都需要
# **宿主网络**，所以默认使用 network_mode: host。
# 若你的 Docker 环境不支持 host 网络（Docker Desktop 旧版本），见文件末尾的桥接方案。

services:
  bambu-monitor:
    build: .
    image: bambu-monitor:latest
    container_name: bambu-monitor
    restart: unless-stopped
    network_mode: host
    environment:
      BAMBU_WEB_PORT: "8080"
      BAMBU_WEB_FPS: "4"          # 网页帧率
      BAMBU_MAX_FPS: "10"         # 每路画面最大帧率（调低可省 CPU）
      BAMBU_MONITOR_CONFIG_DIR: /data
      BAMBU_TOKEN: ""             # 留空则用配置文件里的令牌
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data              # 配置文件与日志
    # 演示模式（无打印机时可用）：把下面这行取消注释，会启动 4 台虚拟打印机
    # command: ["python", "-m", "app.headless", "--sim", "4", "--status-interval", "0"]

# ---------------------------------------------------------------------------
# 桥接网络方案（不支持 host 网络时）：
# 只能通过「已知 IP + 访问代码」直连打印机，自动搜索会被 Docker 网络隔离掉。
#
# services:
#   bambu-monitor:
#     build: .
#     container_name: bambu-monitor
#     restart: unless-stopped
#     ports:
#       - "8080:8080"
#     environment:
#       BAMBU_MONITOR_CONFIG_DIR: /data
#     volumes:
#       - ./data:/data
#     # 首次用命令行添加打印机（在宿主机执行）：
#     #   docker exec -it bambu-monitor python -m app.headless --add-printer "X2D 192.168.31.110 12345678"
